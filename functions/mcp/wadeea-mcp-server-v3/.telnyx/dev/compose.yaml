# Generated by `telnyx-edge dev` (COMPUTE-222). DO NOT EDIT — re-run `telnyx-edge dev`.
#
# Local StatefulActor dev stack for this telnyx.toml project:
#   postgres          Dapr actor state store (state.postgresql)
#   placement         Dapr Placement (actor type -> host routing)
#   actor-runtime     hosts the project's StatefulActor classes
#   actor-sidecar     daprd paired to actor-runtime
#   function-runtime  hosts the project's fetch handler; env.<BINDING> -> actors
#   function-sidecar  daprd paired to function-runtime
#
# Both runtimes read the mounted telnyx.toml directly and load the staged
# bundle at /app/customer/index.js. Hit your function at
# http://localhost:8787.
name: telnyx-dev-wadeea-mcp-server-v2-ec6281db

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: actorstate
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dev"]
      interval: 2s
      timeout: 2s
      retries: 10

  placement:
    image: daprio/dapr:1.13.6
    command: ["./placement", "-port", "50005", "-log-level", "info"]

  actor-runtime:
    image: telnyx/actor-runtime:dev
    # POD_IP: production injects the pod IP via the k8s downward API
    # (status.podIP); compose has no downward API, so read the container's
    # own address at start. The actor self-reports "<POD_IP>:8081" as its
    # WebSocket dial target — without it every local WS upgrade fails the
    # resolve step (COMPUTE-449). Mirrors edge-compute-statefulactor's
    # infra/dev-stack/docker-compose.ws-echo.yaml overlay. Deliberate
    # trade-off: this couples the stack to the actor-runtime image contract
    # (CMD "node dist/main.js", /bin/sh + busybox in node:alpine) — an
    # --actor-image override must be an actor-runtime build (the flag help
    # says so); compose cannot wrap a command while preserving an arbitrary
    # image CMD, and the alternative (runtime-side POD_IP autodetect) would
    # silently break new-CLI + old-image combinations.
    command:
      - /bin/sh
      - -c
      - export POD_IP="$$(hostname -i | awk '{print $$1}')" && exec node dist/main.js
    environment:
      PORT: "3000"
      DAPR_HTTP_PORT: "3500"
      TELNYX_CONFIG_PATH: /app/telnyx.toml
      ACTOR_ENTRY: /app/customer/index.js
    volumes:
      - ../build:/app/customer:ro
      - ../../telnyx.toml:/app/telnyx.toml:ro
    # Ready when the actor app answers its reserved /healthz (no customer code)
    # AND its Dapr sidecar is up (metadata = registered with placement). wget
    # is busybox (in the node image); /v1.0/metadata returns 200+JSON, avoiding
    # the 204 the sidecar /healthz returns.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthz && wget -q -O /dev/null http://127.0.0.1:3500/v1.0/metadata"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 3s
    depends_on:
      postgres:
        condition: service_healthy

  actor-sidecar:
    image: daprio/daprd:1.13.6
    command:
      - "./daprd"
      - "-app-id"
      - "actor-runtime"
      - "-app-port"
      - "3000"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-placement-host-address"
      - "placement:50005"
      - "-components-path"
      - "/dapr-components"
      - "-log-level"
      - "info"
    network_mode: "service:actor-runtime"
    volumes:
      - ./dapr-components:/dapr-components:ro
    depends_on:
      - actor-runtime
      - placement

  function-runtime:
    image: telnyx/function-runtime:dev
    environment:
      PORT: "3000"
      DAPR_HTTP_PORT: "3500"
      DAPR_HOST: 127.0.0.1
      TELNYX_CONFIG_PATH: /app/telnyx.toml
      FUNCTION_ENTRY: /app/customer/index.js
    ports:
      - "8787:3000"
    volumes:
      - ../build:/app/customer:ro
      - ../../telnyx.toml:/app/telnyx.toml:ro
    # The function runtime routes every path to the customer handler, so it has
    # no probe-able health route — gate on its Dapr sidecar instead (the path
    # env.<BINDING> calls travel). Avoids invoking customer code on startup.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3500/v1.0/metadata"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 3s
    depends_on:
      - actor-runtime

  function-sidecar:
    image: daprio/daprd:1.13.6
    command:
      - "./daprd"
      - "-app-id"
      - "function-runtime"
      - "-app-port"
      - "3000"
      - "-dapr-http-port"
      - "3500"
      - "-dapr-grpc-port"
      - "50001"
      - "-placement-host-address"
      - "placement:50005"
      - "-components-path"
      - "/dapr-components"
      - "-log-level"
      - "info"
    network_mode: "service:function-runtime"
    volumes:
      - ./dapr-components:/dapr-components:ro
    depends_on:
      - function-runtime
      - placement
